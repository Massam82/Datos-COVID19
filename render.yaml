databases:
  - name: mi-agenda-db
    plan: free

services:
  - type: web
    name: mi-agenda
    runtime: node
    plan: free
    rootDir: task-manager
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: mi-agenda-db
          property: connectionString
